server {
    listen 80;
    server_name _;
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
    location /iptv/ {
        # docker-compose service name; use your engine's IP:port if not composed
        proxy_pass http://ersatztv:8409;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ErsatzTV embeds ONE absolute URL in the channel master playlist,
        # built from the Host header it receives (e.g.
        # http://192.168.1.50:8410/iptv/session/N/hls.m3u8). That absolute
        # scheme+host breaks one of the two access paths:
        #   - LAN  (http://<lan-ip>:8410)  an https URL fails: ERR_SSL_PROTOCOL_ERROR
        #   - tunnel (https://your-tv.example.com) an http URL is mixed-content blocked
        # Rewriting it to a ROOT-RELATIVE path lets the browser resolve scheme+host
        # itself, so the same playlist works on LAN http AND tunnel https.
        # sub_filter has no regex, so list EVERY scheme+host you actually serve.
        #
        # IMPORTANT: Host must be $http_host, NOT $host. $host strips the :8410
        # port, ErsatzTV then emits http://<lan-ip>/iptv/... and the browser
        # dials port 80 (nothing there): ERR_CONNECTION_REFUSED on the LAN.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types application/vnd.apple.mpegurl application/x-mpegurl application/x-mpegURL application/dash+xml audio/mpegurl audio/x-mpegurl text/plain;
        # EDIT THESE to your LAN IP and (optional) public hostname:
        sub_filter "https://192.168.1.50:8410/iptv/"    "/iptv/";
        sub_filter "http://192.168.1.50:8410/iptv/"     "/iptv/";
        sub_filter "https://your-tv.example.com/iptv/"  "/iptv/";
        sub_filter "http://your-tv.example.com/iptv/"   "/iptv/";
        # belt and braces: portless + direct-engine forms
        sub_filter "http://192.168.1.50/iptv/"          "/iptv/";
        sub_filter "http://192.168.1.50:8409/iptv/"     "/iptv/";

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
